version: 2

project_name: simple-dyndns

builds:
  - id: simple-dyndns
    main: .
    binary: simple-dyndns
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - Readme.md
      - sample.config.json
      - simple-dyndns.service

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true